# Global bundle variables
variables:

  workspace_host:
    description: Databricks workspace URL from GitHub Environment
    default: https://dbc-f5635c5f-848f.cloud.databricks.com

  environment_name:
    description: Deployment environment

  run_as_service_principal_id:
