resources:
  jobs:
    banglapay_smoke_test:
      name: BanglaPay - DAB Smoke Test

      description: >
        Validate Databricks runtime, Spark SQL,
        deployment environment and project parameters.

      max_concurrent_runs: 1

      tasks:
        - task_key: run_smoke_test

          notebook_task:
            notebook_path: ../../src/notebook/dab_smoke_test.py
            source: WORKSPACE

            base_parameters:
              environment: ${var.environment_name}
              workspace_host: ${var.workspace_host}
              data_volume_percent: ${var.data_volume_percent}