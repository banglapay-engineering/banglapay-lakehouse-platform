
name: BanglaPay - Databricks DAB CI/CD

on:
  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

# Prevent concurrent deployments across environments.
concurrency:
  group: banglapay-dab-deployment
  cancel-in-progress: false

jobs:

  # ==================================================
  # 1. VALIDATE DEV BUNDLE
  # ==================================================

  validate:
    name: Validate DEV Bundle
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    env:
      DATABRICKS_AUTH_TYPE: ${{ vars.DATABRICKS_AUTH_TYPE }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      BUNDLE_VAR_workspace_host: ${{ vars.DATABRICKS_HOST }}

      # DAB Run As identity
      BUNDLE_VAR_run_as_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.27.0

      - name: Verify bundle configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f databricks.yml

          echo "DAB configuration file found."

      - name: Verify authentication configuration
        shell: bash
        run: |
          set -euo pipefail

          test "$DATABRICKS_AUTH_TYPE" = "oauth-m2m"
          test -n "$DATABRICKS_HOST"
          test -n "$DATABRICKS_CLIENT_ID"
          test -n "$DATABRICKS_CLIENT_SECRET"

          echo "Authentication configuration verified."

      - name: Verify DAB Run As mapping
        shell: bash
        run: |
          set -euo pipefail

          test -n "$BUNDLE_VAR_run_as_service_principal_id"

          test "$BUNDLE_VAR_run_as_service_principal_id" \
            = "$DATABRICKS_CLIENT_ID"

          echo "DEV Run As identity mapping verified."

      - name: Verify DEV Databricks identity
        run: databricks current-user me --output json

      - name: Validate DEV bundle
        run: databricks bundle validate --target dev


  # ==================================================
  # 2. DEPLOY TO DEV
  # ==================================================

  deploy_dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: validate
    environment: dev
    timeout-minutes: 30

    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    env:
      DATABRICKS_AUTH_TYPE: ${{ vars.DATABRICKS_AUTH_TYPE }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      BUNDLE_VAR_workspace_host: ${{ vars.DATABRICKS_HOST }}

      BUNDLE_VAR_run_as_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.27.0

      - name: Verify DEV authentication
        run: databricks current-user me --output json

      - name: Verify DEV Run As mapping
        shell: bash
        run: |
          set -euo pipefail

          test -n "$BUNDLE_VAR_run_as_service_principal_id"

          test "$BUNDLE_VAR_run_as_service_principal_id" \
            = "$DATABRICKS_CLIENT_ID"

          echo "DEV Run As identity mapping verified."

      - name: Validate DEV bundle
        run: databricks bundle validate --target dev

      - name: Deploy DAB to DEV
        run: databricks bundle deploy --target dev --auto-approve


  # ==================================================
  # 3. DEPLOY TO PROD
  # ==================================================

  deploy_prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy_dev
    environment: prod
    timeout-minutes: 30

    # Only main branch releases can deploy to PROD.
    if: github.ref == 'refs/heads/main'

    env:
      DATABRICKS_AUTH_TYPE: ${{ vars.DATABRICKS_AUTH_TYPE }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      BUNDLE_VAR_workspace_host: ${{ vars.DATABRICKS_HOST }}

      BUNDLE_VAR_run_as_service_principal_id: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.27.0

      - name: Verify PROD authentication
        run: databricks current-user me --output json

      - name: Verify PROD Run As mapping
        shell: bash
        run: |
          set -euo pipefail

          test -n "$BUNDLE_VAR_run_as_service_principal_id"

          test "$BUNDLE_VAR_run_as_service_principal_id" \
            = "$DATABRICKS_CLIENT_ID"

          echo "PROD Run As identity mapping verified."

      - name: Validate PROD bundle
        run: databricks bundle validate --target prod

      - name: Deploy DAB to PROD
        run: databricks bundle deploy --target prod --auto-approve
